name: scheduled-ingestion

# Render's free tier sleeps the dyno after ~15 min without inbound traffic.
# The app's own 14-min self-ping cron canNOT wake a sleeping dyno (the scheduler
# is suspended while asleep), so a single missed ping leaves it down until a
# human opens the app — that's what caused the multi-day ingestion outage.
# This workflow runs from GitHub's infrastructure, which runs regardless of the
# dyno's state. It wakes the service and calls the real ingest endpoint, so a
# missed in-app cron does not leave news stale for days.
#
# Note: GitHub disables scheduled workflows after 60 days of repo inactivity,
# and schedule times can drift a few minutes under load. For a hard guarantee,
# also add an external monitor (e.g. UptimeRobot / cron-job.org) that triggers
# the same endpoint.

on:
  schedule:
    # GitHub scheduled workflows are best-effort and sometimes miss a slot.
    # Run every 5 minutes; ingestion is deduped, so extra runs are cheap and
    # this gives Render more chances to wake even when GitHub drops a run.
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger ingestion
        env:
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
        run: |
          if [ -z "$ADMIN_API_KEY" ]; then
            echo "Missing GitHub secret ADMIN_API_KEY"
            exit 1
          fi

          URL="https://newssummaryapp-api.onrender.com/api/v1/articles/ingest"
          for i in 1 2 3; do
            code=$(curl -sS -L --max-time 240 -o /tmp/ingest-response.json -w "%{http_code}" \
              -X POST \
              -H "X-Admin-Key: $ADMIN_API_KEY" \
              "$URL" || echo 000)
            echo "attempt $i → HTTP $code"
            cat /tmp/ingest-response.json || true
            echo
            if [ "$code" = "200" ] || [ "$code" = "201" ]; then exit 0; fi
            sleep 20
          done
          echo "ingestion did not return 2xx after retries"
          exit 1
