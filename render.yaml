# Render Blueprint — free-tier staging API
# The git repo root IS the backend directory, so no rootDir is needed.
# Apply: Dashboard → Blueprints → New Blueprint Instance → connect this repo

services:
  - type: web
    name: newssummary-api
    env: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run db:deploy && npm run build
    startCommand: node dist/src/main
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "3000"
      # Keeps the free-tier dyno awake (self-ping every 14m) so the 20-minute
      # ingestion cron actually fires — otherwise the dyno sleeps and Kinyarwanda
      # news only refreshes on manual hits. Falls back to RENDER_EXTERNAL_URL.
      - key: PUBLIC_URL
        value: "https://newssummaryapp-api.onrender.com"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_API_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OAUTH_GOOGLE_CLIENT_IDS
        sync: false
      - key: SWAGGER_ENABLED
        value: "true"
      # JS-rendering scraping API for Cloudflare-blocked sources (KigaliToday).
      # Leave unset to disable. Set the key in the dashboard to enable.
      - key: SCRAPER_API_KEY
        sync: false
      - key: SCRAPER_API_PROVIDER
        value: "scraperapi" # or "scrapingbee"
